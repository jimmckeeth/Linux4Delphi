name: Linux4Delphi CI

on:
  push:
    branches: [ main, test** ]
  pull_request:
    branches: [ main, test** ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: error

  pacommander_smoke_test:
    name: pacommander smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: python3 -m py_compile scripts/pacommander.py
      - name: Smoke test proxy + logging
        run: |
          set -e
          python3 -c "
          import asyncio
          async def echo(r, w):
              data = await r.read(4096)
              w.write(b'echo:' + data)
              await w.drain()
              w.close()
          async def main():
              srv = await asyncio.start_server(echo, '127.0.0.1', 64211)
              async with srv:
                  await srv.serve_forever()
          asyncio.run(main())
          " &
          sleep 1
          python3 scripts/pacommander.py --listen-host 127.0.0.1 --log-file /tmp/pacommander.log &
          PROXY_PID=$!
          sleep 1
          python3 -c "
          import socket
          s = socket.create_connection(('127.0.0.1', 64212), timeout=5)
          s.sendall(b'hello-pacommander')
          resp = s.recv(4096)
          assert resp == b'echo:hello-pacommander', resp
          print('relay OK:', resp)
          "
          kill $PROXY_PID
          grep -q "hello-pacommander" /tmp/pacommander.log
          grep -q "echo:hello-pacommander" /tmp/pacommander.log
          echo "log OK"

  ubuntu_test:
    name: Ubuntu 26.04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Setup and Verify PAServer in Ubuntu 26.04
        run: |
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            ubuntu:26.04 \
            bash -c "
              set -e
              chmod +x /workspace/scripts/SetupLinux4Delphi.sh
              /workspace/scripts/SetupLinux4Delphi.sh 13.1
              /usr/local/bin/pa13.1.sh &
              sleep 15
              pgrep paserver
            "

  rhel_test:
    name: RHEL 10
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi10:latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Setup
        run: |
          chmod +x ./scripts/SetupLinux4Delphi.sh
          ./scripts/SetupLinux4Delphi.sh 13.1
      - name: Verify PAServer
        run: |
          /usr/local/bin/pa13.1.sh &
          sleep 15
          pgrep paserver
